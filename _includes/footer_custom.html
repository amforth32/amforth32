<script>
  console.log("✅ footer_custom.html script tag is present and running");

  function applyTheme(theme) {
    if (typeof jtd !== 'undefined' && typeof jtd.setTheme === 'function') {
      jtd.setTheme(theme);
      localStorage.setItem('theme', theme);
      console.log("🎨 Theme applied successfully:", theme);
      return true;
    }
    return false;
  }

  function getPreferredTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) return saved;

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  function initTheme() {
    const preferred = getPreferredTheme();
    let attempts = 0;
    const maxAttempts = 30;

    const tryApply = setInterval(() => {
      attempts++;
      const success = applyTheme(preferred);

      if (success || attempts >= maxAttempts) {
        clearInterval(tryApply);
        if (!success) {
          console.warn("⚠️ Could not apply theme after", maxAttempts, "attempts - jtd still unavailable");
        }
      }
    }, 100);
  }

  initTheme();

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });
  }
</script>
