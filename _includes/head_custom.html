<script>
  document.documentElement.style.visibility = "hidden";

  function applyTheme(theme) {
    if (typeof jtd !== 'undefined') {
      jtd.setTheme(theme);
      localStorage.setItem('theme', theme);
      document.documentElement.style.visibility = "visible";
      console.log("Theme applied:", theme);
    } else {
        console.log("jtd undefined")
    }
  }

  function getPreferredTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) return saved;

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  /* Re-apply theme on navigation (critical for pages with subitems / children) */
  function reapplyOnNavigation() {
    const preferred = getPreferredTheme();
    /* Small delay because navigation often triggers after DOM updates */
    setTimeout(function() {
      applyTheme(preferred);
    }, 50);
  }

  /* Listen for popstate (back/forward buttons) and hash changes */
  window.addEventListener("popstate", reapplyOnNavigation);
  window.addEventListener("hashchange", reapplyOnNavigation);

  /* Also re-apply whenever the page becomes visible again (helps with sidebar interactions) */
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
      reapplyOnNavigation();
    }
  });

  window.addEventListener('load', function() {
    const preferred = getPreferredTheme();
    applyTheme(preferred);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        applyTheme(e.matches ? 'dark' : 'light');
      }
    });
  });
</script>
