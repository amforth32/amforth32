<script>
  // Function to set theme (uses built-in jtd helper)
  function setTheme(theme) {
    if (typeof jtd !== 'undefined') {
      jtd.setTheme(theme);
      localStorage.setItem('theme', theme);  // Persist preference
    }
  }

  // Get user's saved preference or system preference
  function getPreferredTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      return savedTheme;
    }

    // Check system preference
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    const preferred = getPreferredTheme();
    setTheme(preferred);

    // Optional: Listen for system preference changes (auto-switch live)
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    mediaQuery.addEventListener('change', (e) => {
      // Only auto-switch if user hasn't manually overridden
      if (!localStorage.getItem('theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });
  });
</script>
